<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Monitoramento de Preços</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <header class="main-header">
            <h1>Pesquisa de Preços</h1>
            <p class="academic-info">Arquitetura de Dados Relacionais I</p>
        </header>

        <div class="filter-box">
            <form id="formFiltros">
                <div class="field-group">
                    <label>Bairro</label>
                    <select id="bairro" class="select-field">
                        <option value="Todos">Todos</option>
                        <option value="Centro">Centro</option>
                        <option value="Rio Fundo">Rio Fundo</option>
                        <option value="Vale das Palmas">Vale das Palmas</option>
                    </select>
                </div>
                
                <div class="field-group">
                    <label>Combustível</label>
                    <select id="combustivel" class="select-field">
                        <option value="Todos">Todos</option>
                        <option value="Gasolina Comum">Gasolina Comum</option>
                        <option value="Gasolina Aditivada">Gasolina Aditivada</option>
                        <option value="Etanol">Etanol</option>
                        <option value="Diesel S-10">Diesel S-10</option>
                    </select>
                </div>

                <div class="field-group">
                    <label>Posto de Combustível</label>
                    <select id="posto" class="select-field">
                        <option value="Todos">Todos</option>
                        <option value="Posto Schueng LTDA">Posto Schueng LTDA</option>
                        <option value="Posto Vista da Pedra LTDA">Posto Vista da Pedra LTDA</option>
                        <option value="Posto Vista Alegre LTDA">Posto Vista Alegre LTDA</option>
                        <option value="Posto Irmãos Venturini LTDA">Posto Irmãos Venturini LTDA</option>
                        <option value="Auto Posto tesch LTDA">Auto Posto tesch LTDA</option>
                    </select>
                </div>

                <div class="field-group">
                    <label>Preço</label>
                    <select id="preco" class="select-field">
                        <option value="Todos">Todos</option>
                        <option value="Menor">Menor Preço Encontrado</option>
                        <option value="Maior">Maior Preço Encontrado</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">Buscar</button>
            </form>
        </div>

        <!-- Área de resultados configurada com a classe hidden inicial -->
        <div class="results-wrapper hidden">
            <h2 class="results-heading">Registros Encontrados</h2>
            <div class="cards-holder"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
